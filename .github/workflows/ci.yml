name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-24.04
    # The Postgres tests skip themselves without CONTADINHO_TEST_POSTGRES_DSN;
    # the service makes them run alongside the SQLite ones.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: contadinho_test
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: contadinho_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contadinho_test -d contadinho_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CONTADINHO_TEST_POSTGRES_DSN: postgres://contadinho_test:synthetic-test-password@127.0.0.1:5432/contadinho_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # -p 1: the Postgres tests reset the shared database's public schema, so
      # packages must not run them concurrently. -count=1: results depend on the
      # database, so a restored test cache must not stand in for a real run.
      - run: go test -p 1 -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      # Catches embed breakage on PRs instead of only in the release build.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build with the embedded frontend
        run: |
          cp -r dist ../internal/webui/dist
          cd .. && go build -tags embedded_frontend -o /dev/null ./cmd/contadinho

  release:
    name: Release (linux/amd64)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Queued, never cancelled: each run checks out after the previous one has
    # published its tag, so scripts/next-version.sh always sees it.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select version
        id: version
        run: |
          tag=$(scripts/next-version.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "No feat/fix/perf or breaking change since the last tag; skipping release."
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.version.outputs.tag != ''
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.version.outputs.tag != ''
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        if: steps.version.outputs.tag != ''
        run: |
          ./build.sh
          mv contadinho contadinho-linux-amd64
          sha256sum contadinho-linux-amd64 > SHA256SUMS

      - name: Attest provenance
        id: attest
        if: steps.version.outputs.tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: contadinho-linux-amd64

      - name: Publish release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp "$BUNDLE_PATH" contadinho-linux-amd64.sigstore.json
          { scripts/next-version.sh --notes; printf '\n%s\n' "$GITHUB_SHA"; } > notes.md
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            --latest \
            contadinho-linux-amd64 \
            contadinho-linux-amd64.sigstore.json \
            SHA256SUMS
